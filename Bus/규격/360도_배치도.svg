<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>정류장 360도 배치 기획도</title>
<desc>벤치를 중심으로 각 사건과 배경 요소가 어느 방위각에 있는지 보여주는 상단뷰 다이어그램</desc>
<defs>
<style>
  .lbl { font-family: -apple-system, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  .ring-lbl { font-size:13px; fill:#5b6b5e; }
  .evt-lbl { font-size:13.5px; font-weight:700; fill:#1b1d22; }
  .evt-sub { font-size:11px; fill:#5a5f6a; }
  .deg { font-size:11px; fill:#8a6a3a; font-weight:700; }
</style>
</defs>

<circle cx="380" cy="330" r="270" fill="#e7efe4"/>
<circle cx="380" cy="330" r="270" fill="none" stroke="#8fae95" stroke-width="2" stroke-dasharray="4 5"/>
<text x="380" y="72" text-anchor="middle" class="lbl ring-lbl">배경 숲 링 (전 방향, 반경 13~16) — ForestRing</text>

<circle cx="380" cy="330" r="150" fill="#eef1e9" opacity="0.6"/>

<g stroke="#c7cdbf" stroke-width="1">
<line x1="380" y1="330" x2="380" y2="65"/>
<line x1="380" y1="330" x2="215" y2="118"/>
<line x1="380" y1="330" x2="611" y2="145"/>
<line x1="380" y1="330" x2="527" y2="288"/>
<line x1="380" y1="330" x2="380" y2="600"/>
<line x1="380" y1="330" x2="248" y2="470"/>
</g>

<rect x="352" y="308" width="56" height="20" rx="3" fill="#6b3a28"/>
<rect x="340" y="270" width="80" height="10" fill="#4a3222"/>
<text x="380" y="355" text-anchor="middle" class="lbl evt-sub">벤치 (0,0,0)</text>

<circle cx="380" cy="90" r="5" fill="#3f4247"/>
<text x="380" y="55" text-anchor="middle" class="lbl evt-lbl">도로 정면</text>
<text x="380" y="40" text-anchor="middle" class="lbl deg">0°</text>

<circle cx="228" cy="132" r="5" fill="#ff6a3c"/>
<text x="150" y="108" text-anchor="middle" class="lbl evt-lbl">카페</text>
<text x="150" y="93" text-anchor="middle" class="lbl deg">-38°</text>
<text x="150" y="124" text-anchor="middle" class="lbl evt-sub">왼쪽 원거리, 창 조명</text>

<circle cx="596" cy="158" r="5" fill="#e8e2d0"/>
<text x="655" y="140" text-anchor="middle" class="lbl evt-lbl">포스터</text>
<text x="655" y="125" text-anchor="middle" class="lbl deg">+72°</text>
<text x="655" y="156" text-anchor="middle" class="lbl evt-sub">정류장 오른쪽 유리</text>

<path d="M 380 330 L 620 158 A 270 270 0 0 1 500 585 Z" fill="#8fae95" opacity="0.25"/>
<text x="560" y="330" text-anchor="middle" class="lbl evt-lbl">침엽수림 + 공원</text>
<text x="560" y="347" text-anchor="middle" class="lbl deg">+30°~+90°</text>
<text x="560" y="365" text-anchor="middle" class="lbl evt-sub">삼나무열, 도로 건너편</text>

<circle cx="516" cy="290" r="5" fill="#5b6b5e"/>
<text x="600" y="430" text-anchor="middle" class="lbl evt-lbl">개구리 (소리만)</text>
<text x="600" y="415" text-anchor="middle" class="lbl deg">+135°</text>
<text x="600" y="447" text-anchor="middle" class="lbl evt-sub">오른쪽 뒤 풀숲</text>

<circle cx="380" cy="590" r="5" fill="#3a4a36"/>
<text x="380" y="615" text-anchor="middle" class="lbl evt-lbl">비 젖은 풀숲 (뒤)</text>
<text x="290" y="615" text-anchor="middle" class="lbl deg">180°</text>

<circle cx="255" cy="463" r="5" fill="#5b6b5e"/>
<text x="150" y="520" text-anchor="middle" class="lbl evt-lbl">두 번째 고양이 울음</text>
<text x="150" y="505" text-anchor="middle" class="lbl evt-sub">(소리만)</text>
<text x="150" y="538" text-anchor="middle" class="lbl deg">-115°</text>

<text x="380" y="628" text-anchor="middle" class="lbl ring-lbl" font-size="12">0° = 정면(도로 방향) · 시계방향 = +(우측) · 근거리 사건은 배경 숲 링보다 항상 앞에 배치</text>
</svg>
